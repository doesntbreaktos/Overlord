name: Client tests

on:
  push:
    paths:
      - "Overlord-Client/**"
      - "protocol/**"
      - "scripts/generate-wire-protocol.ts"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/client-tests.yml"
  pull_request:
    paths:
      - "Overlord-Client/**"
      - "protocol/**"
      - "scripts/generate-wire-protocol.ts"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/client-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Overlord-Client
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: Overlord-Client/go.mod
          cache: true
          cache-dependency-path: |
            Overlord-Client/go.sum
            go.work.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...
